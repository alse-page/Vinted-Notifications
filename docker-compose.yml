version: '3.8'

services:
  vinted-notifications:
    build: .
    image: vinted-notifications-custom:latest
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - VN_data:/app/data
      - VN_logs:/app/logs
    restart: unless-stopped
    # CHANGED: read_only убран — Chrome/SeleniumBase пишут не только в /tmp,
    # но и в домашнюю директорию (кэш, профиль браузера), а read_only:true
    # блокировал эту запись и не давал Chrome вообще запуститься.
    shm_size: '2gb'
    tmpfs:
      - /tmp

volumes:
  VN_data:
  VN_logs:
